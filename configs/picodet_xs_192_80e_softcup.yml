_BASE_:
- ../picodet/picodet_xs_320_coco_lcnet.yml
- ./softcup_coco.yml

epoch: 80
snapshot_epoch: 5
weights: https://paddledet.bj.bcebos.com/models/pretrained/LCNet_x0_35_pretrained.pdparams

num_classes: 3

PicoHeadV2:
  num_classes: 3

TrainReader:
  batch_transforms:
  - BatchRandomResize: {target_size: [160, 192, 224], random_size: True, random_interp: True, keep_ratio: False}
  - NormalizeImage: {is_scale: true, mean: [0.485,0.456,0.406], std: [0.229, 0.224,0.225]}
  - Permute: {}
  - PadGT: {}
  batch_size: 16

EvalReader:
  sample_transforms:
  - Decode: {}
  - Resize: {interp: 2, target_size: [192, 192], keep_ratio: False}
  - NormalizeImage: {is_scale: true, mean: [0.485,0.456,0.406], std: [0.229, 0.224,0.225]}
  - Permute: {}
  batch_transforms:
  - PadBatch: {pad_to_stride: 32}
  batch_size: 8
  shuffle: false

TestReader:
  inputs_def:
    image_shape: [1, 3, 192, 192]
  sample_transforms:
  - Decode: {}
  - Resize: {interp: 2, target_size: [192, 192], keep_ratio: False}
  - NormalizeImage: {is_scale: true, mean: [0.485,0.456,0.406], std: [0.229, 0.224,0.225]}
  - Permute: {}
  batch_size: 1

LearningRate:
  base_lr: 0.08
  schedulers:
  - !CosineDecay
    max_epochs: 80
  - !LinearWarmup
    start_factor: 0.1
    steps: 300
